<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JDG HUB — счета и расчёты</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="jdg.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .b-short{ font-weight:600; line-height:1.35; margin:2px 0 8px }
  .b-text{ font-size:var(--fs-sm); line-height:1.5; white-space:pre-line; color:var(--fg) }
  .b-flag{ display:flex; gap:8px; align-items:flex-start; margin-top:10px; padding-top:9px;
    border-top:1px solid var(--line); font-size:var(--fs-sm); line-height:1.45 }
  .b-flag .fi{ width:18px; height:18px; flex:0 0 18px; margin-top:1px }
  .b-flag.warn .fi{ color:var(--warn) } .b-flag.note .fi{ color:var(--hint) }
  .src a{ font-size:13px; line-height:1.7 }
</style>
</head>
<body>
<div class="hero"><span class="logo emi" data-icon="coins"></span><h1>Счета и расчёты</h1></div>
<p class="sub">Что от банка не зависит: белый список, порог 15 000 zł, валюта, платформы</p>

<div id="out"><div class="state">Загружаем…</div></div>

<p class="foot" id="src"></p>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
renderDock('home');
setupBack('index.html');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

fetch('banks.json').then(r => r.json()).then(d => {
  document.getElementById('out').innerHTML = d.blocks.map(b => `
    <div class="card" style="margin-bottom:12px">
      <div class="h2" style="margin-bottom:2px">${esc(b.title)}</div>
      <div class="b-short">${esc(b.short)}</div>
      <div class="b-text">${esc(b.text)}</div>
      ${(b.flags || []).map(f => `<div class="b-flag ${f.level}">
        <span class="fi" data-icon="${f.level === 'warn' ? 'alert-triangle' : 'info'}"></span>
        <span>${esc(f.text)}</span></div>`).join('')}
    </div>`).join('');
  document.getElementById('src').innerHTML =
    'Источники: <span class="src">' + d.sources.map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`
    ).join(' · ') + '</span><br>Обновлено ' + esc(d.updated) +
    '. Справочная информация, не юридическая и не налоговая консультация.';
  Icons.hydrate();
}).catch(() => {
  document.getElementById('out').innerHTML =
    '<div class="state">Не получилось загрузить данные. Обнови страницу.</div>';
});
</script>
</body>
</html>
