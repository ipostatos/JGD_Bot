<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Документ</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="icons.js"></script>
<style>
  /* Домашняя полоска iPhone: без viewport-fit=cover env() всегда 0, и панель
     уезжала под индикатор — кнопки обрезались. Высота панели = контент +
     safe-area, её же вычитаем из области страниц. */
  :root{ --bar-h: calc(56px + env(safe-area-inset-bottom, 0px)) }
  html,body{margin:0; height:100%; overflow:hidden; padding:0}
  #pages{position:absolute; inset:0 0 var(--bar-h) 0; overflow:auto;
    -webkit-overflow-scrolling:touch; padding:10px; text-align:center}
  /* ширину canvas задаёт JS; при зуме >100% горизонтальный скролл в #pages */
  #pages canvas{display:block; margin:0 auto 10px;
    background:#fff; border-radius:4px; box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .toolbar{position:absolute; left:0; right:0; bottom:0; min-height:56px; display:flex;
    align-items:center; gap:8px; background:var(--card);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--border)}
  .toolbar button{flex:0 0 auto; width:40px; height:40px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-size:18px; cursor:pointer; line-height:1; display:inline-flex;
    align-items:center; justify-content:center}
  .toolbar button svg{width:19px; height:19px}
  .toolbar .pageinfo{flex:1; text-align:center; font-size:13px; color:var(--hint);
    font-variant-numeric:tabular-nums}
  .toolbar .zoom{font-size:13px; min-width:46px; text-align:center; color:var(--hint)}
  .status{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; text-align:center; gap:12px; color:var(--hint)}
  .status .spin{width:34px; height:34px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .status a{color:var(--accent); text-decoration:none; border:1px solid var(--border);
    border-radius:10px; padding:9px 16px; cursor:pointer}
  .hidden{display:none !important}
  .bar{height:4px; background:var(--border); border-radius:3px; overflow:hidden;
    width:70%; max-width:240px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s}
  @media print{
    .toolbar,.status{display:none !important}
    html,body{overflow:visible; background:#fff}
    #pages{position:static; overflow:visible; padding:0}
    #pages canvas{box-shadow:none; border-radius:0; width:100% !important;
      height:auto !important; page-break-after:always}
  }
</style>
</head>
<body>

<div id="pages" class="hidden"></div>

<div id="status" class="status">
  <div class="spin"></div>
  <div id="statusText">Загрузка документа…</div>
  <div class="bar"><i id="loadBar"></i></div>
</div>

<div class="toolbar">
  <button id="zoomOut" title="Меньше">−</button>
  <span class="zoom" id="zoomLbl">100%</span>
  <button id="zoomIn" title="Больше">+</button>
  <span class="pageinfo" id="pageInfo">—</span>
  <button id="print" title="Печать"></button>
  <button id="dl" title="Скачать"></button>
</div>

<!-- pdf.js локально (без CDN): офлайн и строгий CSP -->
<script type="module" src="js/reader.js"></script>
</body>
</html>
